<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดใบลา · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/leave-request-detail.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <a class="backlink" href="leave-requests.html"><span data-icon="arrow-left"></span>กลับไปรายการใบลา</a>
    <h1 id="หัวเรื่อง">รายละเอียดใบลา</h1>
    <p class="subtitle" id="คำโปรย">กำลังเปิดใบลา</p>

    <div id="กล่องใบลา" class="card">
      <p>กำลังโหลดข้อมูล…</p>
    </div>

    <div id="กล่องความเห็น" class="card hidden">
      <h2>ความเห็นการอนุมัติ</h2>
      <div id="รายการความเห็น"></div>

      <label for="ข้อความความเห็น">เขียนความเห็นใหม่</label>
      <textarea id="ข้อความความเห็น" placeholder="พิมพ์ความเห็นถึงผู้ขอลา"></textarea>
      <div id="เตือนความเห็น" class="alert alert-error hidden" role="alert"></div>
      <div class="btn-row">
        <button type="button" id="ปุ่มส่งความเห็น">ส่งความเห็น</button>
      </div>
    </div>
  </div>
</body>
</html>
